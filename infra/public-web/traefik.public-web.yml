# Public Web edge composition fragment. Apply through the infrastructure owner.
http:
  routers:
    fuma-public-web:
      rule: Host(`trimly.co.ke`)
      service: fuma-public-web
      middlewares: [fuma-public-security]
      tls: true
    fuma-public-www:
      rule: Host(`www.trimly.co.ke`)
      service: noop@internal
      middlewares: [fuma-public-www-redirect]
      tls: true
  middlewares:
    fuma-public-www-redirect:
      redirectRegex: { regex: "^https://www\\.trimly\\.co\\.ke/(.*)", replacement: "https://trimly.co.ke/$1", permanent: true }
    fuma-public-security:
      headers: { customResponseHeaders: { X-Robots-Tag: "all" } }
  services:
    fuma-public-web:
      loadBalancer:
        healthCheck: { path: /api/health, interval: 10s, timeout: 2s }
        servers: [{ url: "http://fuma-public-web:3002" }]
# No wildcard router belongs to this service. Tenant and custom hosts stay with the release runtime.
