apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuma-public-web
  labels: { app.kubernetes.io/name: fuma-public-web }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: fuma-public-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: fuma-public-web } }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ${FUMA_WEB_IMAGE_DIGEST}
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3002 }]
          envFrom: [{ secretRef: { name: fuma-public-web-runtime } }]
          readinessProbe: { httpGet: { path: /api/health, port: http, httpHeaders: [{ name: Host, value: web-internal.service }] }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /api/health, port: http, httpHeaders: [{ name: Host, value: web-internal.service }] }, periodSeconds: 15, timeoutSeconds: 2, failureThreshold: 3 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 10"] } } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/apps/web/.next/cache }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: fuma-public-web }
spec:
  selector: { app.kubernetes.io/name: fuma-public-web }
  ports: [{ name: http, port: 3002, targetPort: http }]
