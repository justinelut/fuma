apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: fuma-slos, namespace: fuma }
spec:
  groups:
    - name: fuma.availability
      rules:
        - alert: FumaPublicWebFastBurn
          expr: sum(rate(http_requests_total{service="public-web",status=~"5.."}[5m])) / sum(rate(http_requests_total{service="public-web"}[5m])) > 0.014
          for: 10m
          labels: { severity: page, runbook: public-web-rollback, owner: public-web-oncall }
          annotations: { summary: Public web availability SLO fast burn }
        - alert: FumaProductApiFastBurn
          expr: sum(rate(http_requests_total{service="runtime-web",status=~"5.."}[5m])) / sum(rate(http_requests_total{service="runtime-web"}[5m])) > 0.028
          for: 10m
          labels: { severity: page, runbook: runtime-service-loss, owner: platform-oncall }
          annotations: { summary: Product API availability SLO fast burn }
        - alert: FumaQueueStuck
          expr: max(fuma_job_queue_age_seconds{state="ready"}) > 300
          for: 10m
          labels: { severity: page, runbook: stuck-publish-queue, owner: publication-oncall }
          annotations: { summary: Durable job queue is stuck }
        - alert: FumaBackupTooOld
          expr: time() - max(fuma_backup_completed_timestamp_seconds) > 28800
          for: 15m
          labels: { severity: page, runbook: backup-restore, owner: platform-oncall }
          annotations: { summary: Encrypted off-host backup is older than the signed RPO }
        - alert: FumaRestoreDrillOverdue
          expr: time() - max(fuma_restore_drill_completed_timestamp_seconds) > 2592000
          for: 1h
          labels: { severity: ticket, runbook: backup-restore, owner: platform-oncall }
          annotations: { summary: Restore drill is overdue }
    - name: fuma.providers
      rules:
        - alert: FumaPaymentVerificationFailures
          expr: sum(rate(fuma_payment_verification_failures_total[10m])) > 0.1
          for: 10m
          labels: { severity: page, runbook: payment-provider, owner: commerce-oncall }
        - alert: FumaEmailDeliveryFailures
          expr: sum(rate(fuma_email_delivery_failures_total[15m])) > 0.1
          for: 15m
          labels: { severity: page, runbook: email-delivery, owner: messaging-oncall }
        - alert: FumaCertificateExpiry
          expr: min(fuma_domain_certificate_expiry_seconds) < 604800
          for: 1h
          labels: { severity: page, runbook: domain-certificate, owner: domains-oncall }
    - name: fuma.public-performance
      rules:
        - alert: FumaPublicLcpRegression
          expr: histogram_quantile(0.75, sum by (le) (rate(fuma_public_web_vitals_bucket{metric="LCP"}[30m]))) > 2500
          for: 30m
          labels: { severity: ticket, runbook: public-web-performance, owner: public-web-oncall }
# Labels intentionally omit email, IP, raw host, URL query, token, payment reference, and free-form tenant input.

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: fuma-red-use, namespace: fuma }
spec:
  groups:
    - name: fuma.red-use
      rules:
        - alert: FumaRuntimeP95Latency
          expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket{service=~"runtime-web|public-web"}[10m]))) > 0.8
          for: 15m
          labels: { severity: page, runbook: runtime-service-loss, owner: platform-oncall }
          annotations: { summary: Runtime or public Web p95 latency exceeds the signed budget }
        - alert: FumaPodCpuSaturation
          expr: max by (pod) (rate(container_cpu_usage_seconds_total{namespace="fuma",container!=""}[5m]) / on(namespace,pod,container) kube_pod_container_resource_limits{namespace="fuma",resource="cpu"}) > 0.85
          for: 15m
          labels: { severity: ticket, runbook: capacity-saturation, owner: platform-oncall }
          annotations: { summary: A Fuma workload is CPU saturated }
        - alert: FumaPodMemorySaturation
          expr: max by (pod) (container_memory_working_set_bytes{namespace="fuma",container!=""} / on(namespace,pod,container) kube_pod_container_resource_limits{namespace="fuma",resource="memory"}) > 0.9
          for: 10m
          labels: { severity: page, runbook: capacity-saturation, owner: platform-oncall }
          annotations: { summary: A Fuma workload is memory saturated }
        - alert: FumaPublicConversionCollectorFailures
          expr: sum(rate(fuma_public_conversion_events_total{result="failed"}[15m])) > 0.1
          for: 15m
          labels: { severity: ticket, runbook: public-web-operations, owner: public-web-oncall }
          annotations: { summary: Minimized public conversion event collection is failing }
# Metric labels are bounded service/result/resource identifiers; tenant names, hosts, URLs, emails, provider references and free-form input are forbidden.
