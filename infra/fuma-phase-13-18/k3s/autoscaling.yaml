apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: runtime-web, namespace: fuma }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: runtime-web }
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp: { stabilizationWindowSeconds: 30, policies: [{ type: Percent, value: 100, periodSeconds: 60 }] }
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 25, periodSeconds: 60 }] }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: public-web, namespace: fuma }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: public-web }
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp: { stabilizationWindowSeconds: 30, policies: [{ type: Percent, value: 100, periodSeconds: 60 }] }
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 25, periodSeconds: 60 }] }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: runtime-worker-queue, namespace: fuma }
spec:
  scaleTargetRef: { name: runtime-worker }
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 12
  fallback: { failureThreshold: 3, replicas: 1 }
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: fuma_ready_job_queue_age_seconds
        threshold: "30"
        query: max(fuma_job_queue_age_seconds{state="ready"})
# Scheduler remains exactly one replica with a Redis/advisory-lock fence; it is never autoscaled.
