apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: security-headers, namespace: fuma }
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    customResponseHeaders: { Server: "" }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: www-canonical, namespace: fuma }
spec: { redirectRegex: { regex: "^https://www\\.trimly\\.co\\.ke/(.*)", replacement: "https://trimly.co.ke/${1}", permanent: true } }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: public-web, namespace: fuma }
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`trimly.co.ke`)
      kind: Rule
      priority: 100
      middlewares: [{ name: security-headers }]
      services: [{ name: public-web, port: 80 }]
    - match: Host(`www.trimly.co.ke`)
      kind: Rule
      priority: 100
      middlewares: [{ name: www-canonical }, { name: security-headers }]
      services: [{ name: public-web, port: 80 }]
  tls: { secretName: fuma-public-tls }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: identity, namespace: fuma }
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`auth.trimly.co.ke`)
      kind: Rule
      priority: 100
      middlewares: [{ name: security-headers }]
      services: [{ name: runtime-web, port: 80 }]
  tls: { secretName: fuma-product-tls }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: app-control-contribution, namespace: fuma }
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`app.trimly.co.ke`) && (PathPrefix(`/marketplace`) || PathPrefix(`/transfers`) || PathPrefix(`/secure-payment`) || PathPrefix(`/api/secure-payment-settings`))
      kind: Rule
      priority: 200
      middlewares: [{ name: security-headers }]
      services: [{ name: control-surfaces, port: 80 }]
  tls: { secretName: fuma-product-tls }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: app-product, namespace: fuma }
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`app.trimly.co.ke`)
      kind: Rule
      priority: 100
      middlewares: [{ name: security-headers }]
      services: [{ name: runtime-web, port: 80 }]
  tls: { secretName: fuma-product-tls }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: admin-console-contribution, namespace: fuma }
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`admin.trimly.co.ke`) && PathPrefix(`/internal`)
      kind: Rule
      priority: 200
      middlewares: [{ name: security-headers }]
      services: [{ name: control-surfaces, port: 80 }]
    - match: Host(`admin.trimly.co.ke`)
      kind: Rule
      priority: 100
      middlewares: [{ name: security-headers }]
      services: [{ name: runtime-web, port: 80 }]
  tls: { secretName: fuma-product-tls }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: tenant-wildcard, namespace: fuma }
spec:
  entryPoints: [websecure]
  routes:
    - match: HostRegexp(`[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.trimly\\.co\\.ke`)
      kind: Rule
      priority: 10
      middlewares: [{ name: security-headers }]
      services: [{ name: runtime-web, port: 80 }]
  tls: { secretName: fuma-tenant-wildcard-tls }
# No default route exists. Custom domains are emitted as exact-host IngressRoutes only after verified domain authority.
