apiVersion: v1
kind: Namespace
metadata:
  name: fuma
---
# ── PostgreSQL ────────────────────────────────────────────────────────────────
# Single-replica StatefulSet with a durable volume. Credentials come from the
# fuma-secrets Secret so nothing is baked into this manifest.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fuma
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: fuma
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: fuma-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: fuma-secrets, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1Gi }
          readinessProbe:
            exec: { command: ["pg_isready", "-d", "fuma"] }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fuma
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
  clusterIP: None
---
# ── Redis ─────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fuma
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fuma
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
# ── MinIO object storage ──────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: fuma
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 50Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: fuma
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - { containerPort: 9000 }
            - { containerPort: 9001 }
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: fuma-secrets, key: FUMA_MINIO_ACCESS_KEY_ID } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: fuma-secrets, key: FUMA_MINIO_SECRET_ACCESS_KEY } }
          volumeMounts:
            - { name: minio-data, mountPath: /data }
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 512Mi }
      volumes:
        - name: minio-data
          persistentVolumeClaim: { claimName: minio-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: fuma
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000 }
    - { name: console, port: 9001 }
---
# One-shot bucket creation. Idempotent, so re-running every deploy is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: fuma
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          envFrom: [{ secretRef: { name: fuma-secrets } }]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set loc http://minio:9000 "$FUMA_MINIO_ACCESS_KEY_ID" "$FUMA_MINIO_SECRET_ACCESS_KEY" >/dev/null 2>&1; do
                echo "waiting for minio..."; sleep 3
              done
              mc mb --ignore-existing "loc/${FUMA_MINIO_BUCKET:-fuma}"
              echo "minio-init done: ${FUMA_MINIO_BUCKET:-fuma}"
---
# ── Studio migration job ──────────────────────────────────────────────────────
# Runs before the web rollout so schema is present. Recreated each deploy
# because Job specs are immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: fuma-migrate
  namespace: fuma
spec:
  # Apply suspended so the deploy can wait for PostgreSQL and align the
  # persisted role password before the first migration connection attempt.
  suspend: true
  # No ttlSecondsAfterFinished: the deploy deletes and recreates this Job each
  # run, and retaining failed pods preserves actionable migration logs.
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ghcr-secret }]
      containers:
        - name: migrate
          image: __FUMA_RUNTIME_IMAGE__
          args: ["migration"]
          envFrom: [{ secretRef: { name: fuma-secrets } }]
          env:
            - { name: FUMA_ROLE, value: "web" }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1Gi }
---
# ── Studio web ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuma-studio
  namespace: fuma
  labels: { app: fuma-studio }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: fuma-studio }
  template:
    metadata:
      labels: { app: fuma-studio }
    spec:
      imagePullSecrets: [{ name: ghcr-secret }]
      containers:
        - name: studio
          image: __FUMA_RUNTIME_IMAGE__
          args: ["studio"]
          ports: [{ name: http, containerPort: 3101 }]
          envFrom: [{ secretRef: { name: fuma-secrets } }]
          env:
            - { name: FUMA_ROLE, value: "web" }
            - { name: FUMA_HOSTED, value: "true" }
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "3101" }
            - { name: STATIC_DIR, value: "/workspace/apps/studio/dist" }
            - { name: FUMA_PUBLIC_PROJECTION_INTERNAL_HOST, value: "runtime-web.fuma.svc.cluster.local" }
            - { name: FUMA_REDIS_NAMESPACE, value: "fuma-production" }
            - { name: FUMA_WEB_REVISION, value: "__FUMA_SOURCE_SHA__" }
          resources:
            requests: { memory: 512Mi, cpu: 200m }
            limits: { memory: 1536Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fuma-studio
  namespace: fuma
spec:
  selector: { app: fuma-studio }
  ports: [{ name: http, port: 80, targetPort: http }]
---
# Stable private alias consumed by public Web. It is cluster-only and has no
# IngressRoute or external DNS name.
apiVersion: v1
kind: Service
metadata:
  name: runtime-web
  namespace: fuma
spec:
  selector: { app: fuma-studio }
  ports: [{ name: http, port: 80, targetPort: http }]
---
# ── Worker and scheduler ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuma-worker
  namespace: fuma
spec:
  replicas: 1
  selector:
    matchLabels: { app: fuma-worker }
  template:
    metadata:
      labels: { app: fuma-worker }
    spec:
      imagePullSecrets: [{ name: ghcr-secret }]
      containers:
        - name: worker
          image: __FUMA_RUNTIME_IMAGE__
          args: ["worker"]
          envFrom: [{ secretRef: { name: fuma-secrets } }]
          env:
            - { name: FUMA_ROLE, value: "worker" }
            - { name: FUMA_HOSTED, value: "true" }
            - { name: FUMA_HEALTH_HOST, value: "0.0.0.0" }
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits: { memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuma-scheduler
  namespace: fuma
spec:
  replicas: 1
  selector:
    matchLabels: { app: fuma-scheduler }
  template:
    metadata:
      labels: { app: fuma-scheduler }
    spec:
      imagePullSecrets: [{ name: ghcr-secret }]
      containers:
        - name: scheduler
          image: __FUMA_RUNTIME_IMAGE__
          args: ["scheduler"]
          envFrom: [{ secretRef: { name: fuma-secrets } }]
          env:
            - { name: FUMA_ROLE, value: "scheduler" }
            - { name: FUMA_HOSTED, value: "true" }
            - { name: FUMA_HEALTH_HOST, value: "0.0.0.0" }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 768Mi }
---
# ── Routing ───────────────────────────────────────────────────────────────────
# Studio owns the app, auth and admin hosts. The public Web keeps the apex and
# www hosts through its own IngressRoute, so these must not overlap.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: studio-security-headers
  namespace: fuma
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders: { Server: "" }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fuma-studio
  namespace: fuma
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`app.__FUMA_ROOT_DOMAIN__`)
      kind: Rule
      priority: 100
      middlewares: [{ name: studio-security-headers }]
      services: [{ name: fuma-studio, port: 80 }]
    - match: Host(`auth.__FUMA_ROOT_DOMAIN__`)
      kind: Rule
      priority: 100
      middlewares: [{ name: studio-security-headers }]
      services: [{ name: fuma-studio, port: 80 }]
    - match: Host(`admin.__FUMA_ROOT_DOMAIN__`)
      kind: Rule
      priority: 100
      middlewares: [{ name: studio-security-headers }]
      services: [{ name: fuma-studio, port: 80 }]
  tls:
    certResolver: le
