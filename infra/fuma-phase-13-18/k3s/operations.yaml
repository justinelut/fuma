apiVersion: batch/v1
kind: Job
metadata: { name: fuma-migration-RELEASE_SHA, namespace: fuma, labels: { fuma-operation: migration } }
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { fuma-operation: migration } }
    spec:
      restartPolicy: Never
      serviceAccountName: runtime
      containers:
        - name: migrate
          image: ghcr.io/corebunch/fuma-runtime@sha256:REQUIRED_DIGEST
          args: ["fuma:migrate", "--release-manifest=/run/release/paired-release.json", "--advisory-lock"]
          envFrom: [{ secretRef: { name: fuma-runtime-secrets } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: release, mountPath: /run/release, readOnly: true }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: release, configMap: { name: paired-release-manifest } }, { name: tmp, emptyDir: { sizeLimit: 256Mi } }]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: fuma-encrypted-backup, namespace: fuma }
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata: { labels: { fuma-operation: backup } }
        spec:
          restartPolicy: Never
          serviceAccountName: runtime
          containers:
            - name: backup
              image: ghcr.io/corebunch/fuma-ops@sha256:REQUIRED_DIGEST
              args: ["backup", "--postgres", "--minio", "--config", "--encrypt", "--off-host", "--retention=35d", "--manifest"]
              env:
                - { name: FUMA_RELEASE_SOURCE_SHA, valueFrom: { configMapKeyRef: { name: paired-release-manifest, key: sourceSha } } }
                - { name: FUMA_BACKUP_RETENTION_CLASS, value: "daily-35d" }
                - { name: FUMA_CONFIG_SOURCE, value: "config/fuma-production" }
              envFrom: [{ secretRef: { name: fuma-backup-secrets } }]
              resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: ["ALL"] } }
              volumeMounts: [{ name: tmp, mountPath: /tmp }]
          volumes: [{ name: tmp, emptyDir: { sizeLimit: 4Gi } }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: fuma-restore-verify-RELEASE_SHA, namespace: fuma-restore-verification }
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { fuma-operation: restore-verification } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: restore
          image: ghcr.io/corebunch/fuma-ops@sha256:REQUIRED_DIGEST
          args: ["restore-verify", "--ephemeral-only", "--counts", "--hashes", "--routes", "--signed-rpo-rto"]
          env:
            - { name: FUMA_EPHEMERAL_RESTORE, value: "true" }
            - { name: FUMA_RESTORE_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          envFrom: [{ secretRef: { name: fuma-restore-verification-secrets } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 20Gi } }]

---
apiVersion: batch/v1
kind: CronJob
metadata: { name: fuma-encrypted-monthly-backup, namespace: fuma }
spec:
  schedule: "43 2 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata: { labels: { fuma-operation: monthly-backup } }
        spec:
          restartPolicy: Never
          serviceAccountName: runtime
          containers:
            - name: backup
              image: ghcr.io/corebunch/fuma-ops@sha256:REQUIRED_DIGEST
              args: ["backup", "--postgres", "--minio", "--config", "--encrypt", "--off-host", "--retention=13mo", "--manifest"]
              env:
                - { name: FUMA_RELEASE_SOURCE_SHA, valueFrom: { configMapKeyRef: { name: paired-release-manifest, key: sourceSha } } }
                - { name: FUMA_BACKUP_RETENTION_CLASS, value: "monthly-13mo" }
                - { name: FUMA_CONFIG_SOURCE, value: "config/fuma-production" }
              envFrom: [{ secretRef: { name: fuma-backup-secrets } }]
              resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: ["ALL"] } }
              volumeMounts: [{ name: tmp, mountPath: /tmp }]
          volumes: [{ name: tmp, emptyDir: { sizeLimit: 4Gi } }]

---
apiVersion: v1
kind: Namespace
metadata:
  name: fuma-restore-verification
  labels: { pod-security.kubernetes.io/enforce: restricted, fuma-purpose: restore-verification }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: restore-default-deny, namespace: fuma-restore-verification }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
