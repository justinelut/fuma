# Local-development Postgres service.
#
# `bun run dev` brings this service up automatically when the canonical local
# PostgreSQL URL is used. Set DATABASE_URL to use an existing PostgreSQL server.
#
# For a fully-containerized stack (closer to production), use:
#   docker compose -f compose.prod.yml -f compose.build.yml up --build

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: instatic
      POSTGRES_USER: instatic
      POSTGRES_PASSWORD: instatic
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
