name: Fuma Studio release

on:
  workflow_dispatch: {}
  push:
    branches: [integration/fuma-batch-7-20260727]
    paths:
      - apps/studio/**
      - packages/**
      - infra/fuma-phase-13-18/docker/runtime.Dockerfile
      - infra/fuma-phase-13-18/docker/runtime-entrypoint.sh
      - infra/fuma-phase-13-18/k3s/studio-production.template.yaml
      - .github/workflows/fuma-studio-release.yml
      # Deployment-only changes — new secrets, manifest env, ingress — never
      # reached production because this workflow ignored them, so a merged fix
      # silently sat undeployed until an unrelated app change came along.
      - .github/workflows/fuma-studio-deploy.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: fuma-studio-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Studio runtime image
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - id: identity
        run: |
          set -euo pipefail
          echo "lock_hash=$(sha256sum bun.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "migration=$(bun --cwd=apps/studio -e "import { runnableHostedMigrations } from './server/fuma/db/migrations/index.ts'; console.log(runnableHostedMigrations.at(-1).id)")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/fuma-phase-13-18/docker/runtime.Dockerfile
          target: runtime
          push: true
          platforms: linux/arm64
          build-args: |
            BUN_IMAGE=${{ vars.FUMA_BUN_IMAGE_DIGEST }}
            SOURCE_SHA=${{ github.sha }}
            LOCK_HASH_SHA256=${{ steps.identity.outputs.lock_hash }}
            MIGRATION_HIGH_WATER_MARK=${{ steps.identity.outputs.migration }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fuma-runtime:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/fuma-runtime:latest
          cache-from: type=gha,scope=studio
          cache-to: type=gha,mode=max,scope=studio

      - name: Report published image
        run: |
          {
            echo "### Fuma Studio runtime image"
            echo
            echo "- tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- roles: \`web\`, \`worker\`, \`scheduler\`, \`migration\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy published Studio image
    needs: build
    uses: ./.github/workflows/fuma-studio-deploy.yml
    with:
      image_tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
