name: Fuma production diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuma-production-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact Fuma runtime pods
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ vars.SSH_USER }}
          port: ${{ vars.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            NS=fuma
            sudo kubectl -n "$NS" get pods,deployments,jobs,services,ingressroutes.traefik.io -o wide
            for app in fuma-studio fuma-worker fuma-scheduler; do
              pod="$(sudo kubectl -n "$NS" get pods -l app="$app" --sort-by=.metadata.creationTimestamp -o name | tail -1)"
              echo "════════ $app newest=$pod ════════"
              if [ -z "$pod" ]; then continue; fi
              sudo kubectl -n "$NS" describe "$pod" | tail -80 || true
              echo "──── current logs ────"
              sudo kubectl -n "$NS" logs "$pod" --all-containers=true --tail=240 || true
              echo "──── previous logs ────"
              sudo kubectl -n "$NS" logs "$pod" --all-containers=true --previous --tail=240 || true
            done
            echo "════════ migration history ════════"
            sudo kubectl -n "$NS" logs job/fuma-migrate --tail=80 || true
            echo "════════ protected owner invariants ════════"
            studio_pod="$(sudo kubectl -n "$NS" get pods -l app=fuma-studio --sort-by=.metadata.creationTimestamp -o name | tail -1)"
            sudo kubectl -n "$NS" exec "$studio_pod" -- bun -e '
              import { SQL } from "bun";
              const db = new SQL(process.env.DATABASE_URL!);
              const email = process.env.FUMA_PROTECTED_OWNER_EMAIL?.trim().toLowerCase() ?? "";
              const admin = "admin", platformId = "fuma-platform", platformSlug = "fuma-platform", membershipId = "fuma-platform-owner", ownerRole = "owner", profileKind = "platform", active = "active", bootstrapKey = "fuma-platform-launch-v1";
              const result = await db`
                select
                  exists(select 1 from auth_users where lower(btrim(email))=${email}) "ownerUserExists",
                  exists(select 1 from auth_users where lower(btrim(email))=${email} and role=${admin} and banned=false) "ownerAdminProtected",
                  exists(select 1 from auth_organizations where id=${platformId} and slug=${platformSlug}) "platformOrganizationExists",
                  exists(select 1 from auth_members member join auth_users staff on staff.id=member.user_id where member.id=${membershipId} and member.organization_id=${platformId} and member.role=${ownerRole} and lower(btrim(staff.email))=${email}) "ownerMembershipExists",
                  exists(select 1 from fuma_organization_profiles where organization_id=${platformId} and kind=${profileKind} and status=${active}) "platformProfileExists",
                  exists(select 1 from fuma_organization_bootstrap_receipts where bootstrap_key=${bootstrapKey} and organization_id=${platformId}) "bootstrapReceiptExists"
              `;
              console.log(JSON.stringify(result[0]));
              await db.close();
            '
