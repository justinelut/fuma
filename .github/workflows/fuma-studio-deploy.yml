name: Fuma Studio deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published fuma-runtime tag to deploy (7-character commit SHA)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: fuma-studio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Studio to K3s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the Studio environment secret
        env:
          FUMA_ENV_SECRET: ${{ secrets.FUMA_ENV_SECRET }}
          FUMA_DEPLOYMENT_ROOT_DOMAIN: ${{ vars.FUMA_DEPLOYMENT_ROOT_DOMAIN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FUMA_OBJECT_ACCESS_SIGNING_SECRET: ${{ secrets.FUMA_OBJECT_ACCESS_SIGNING_SECRET }}
          FUMA_AI_BYOK_METADATA_KEY: ${{ secrets.FUMA_AI_BYOK_METADATA_KEY }}
          FUMA_EXPERT_INQUIRY_KEY: ${{ secrets.FUMA_EXPERT_INQUIRY_KEY }}
          FUMA_MEMBER_AUTH_SECRET: ${{ secrets.FUMA_MEMBER_AUTH_SECRET }}
          FUMA_PAYSTACK_PLATFORM_PUBLIC_KEY: ${{ secrets.FUMA_PAYSTACK_PLATFORM_PUBLIC_KEY }}
          FUMA_PAYSTACK_PLATFORM_SECRET_KEY: ${{ secrets.FUMA_PAYSTACK_PLATFORM_SECRET_KEY }}
          FUMA_OCI_EMAIL_REGION: ${{ secrets.FUMA_OCI_EMAIL_REGION }}
          FUMA_OCI_EMAIL_TENANCY_ID: ${{ secrets.FUMA_OCI_EMAIL_TENANCY_ID }}
          FUMA_OCI_EMAIL_USER_ID: ${{ secrets.FUMA_OCI_EMAIL_USER_ID }}
          FUMA_OCI_EMAIL_FINGERPRINT: ${{ secrets.FUMA_OCI_EMAIL_FINGERPRINT }}
          FUMA_OCI_EMAIL_PRIVATE_KEY_PEM: ${{ secrets.FUMA_OCI_EMAIL_PRIVATE_KEY_PEM }}
          FUMA_OCI_EMAIL_COMPARTMENT_ID: ${{ secrets.FUMA_OCI_EMAIL_COMPARTMENT_ID }}
          FUMA_OCI_EMAIL_APPROVED_SENDER: ${{ secrets.FUMA_OCI_EMAIL_APPROVED_SENDER }}
          FUMA_OCI_EVENT_VERIFICATION_SECRET: ${{ secrets.FUMA_OCI_EVENT_VERIFICATION_SECRET }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_TAG" | grep -Eq '^[a-f0-9]{7}$'
          if [ -z "${FUMA_ENV_SECRET:-}" ]; then
            echo "::error::FUMA_ENV_SECRET is empty. It must contain every required KEY=value line."
            exit 1
          fi
          mkdir -p k8s/_staged
          printf '%s\n' "$FUMA_ENV_SECRET" > k8s/_staged/fuma.env

          # Values Fuma derives rather than expecting an operator to repeat.
          inject() {
            key="$1"; value="$2"
            grep -v "^${key}=" k8s/_staged/fuma.env > k8s/_staged/fuma.env.tmp || true
            mv k8s/_staged/fuma.env.tmp k8s/_staged/fuma.env
            if [ -n "$value" ]; then printf '%s=%s\n' "$key" "$value" >> k8s/_staged/fuma.env; fi
          }
          inject FUMA_ENV production
          inject FUMA_HOSTED true
          inject FUMA_DEPLOYMENT_ROOT_DOMAIN "$FUMA_DEPLOYMENT_ROOT_DOMAIN"
          inject FUMA_OBJECT_ACCESS_SIGNING_SECRET "${FUMA_OBJECT_ACCESS_SIGNING_SECRET:-}"
          inject FUMA_AI_BYOK_METADATA_KEY "${FUMA_AI_BYOK_METADATA_KEY:-}"
          inject FUMA_EXPERT_INQUIRY_KEY "${FUMA_EXPERT_INQUIRY_KEY:-}"
          inject FUMA_MEMBER_AUTH_SECRET "${FUMA_MEMBER_AUTH_SECRET:-}"
          inject FUMA_PAYSTACK_PLATFORM_PUBLIC_KEY "${FUMA_PAYSTACK_PLATFORM_PUBLIC_KEY:-}"
          inject FUMA_PAYSTACK_PLATFORM_SECRET_KEY "${FUMA_PAYSTACK_PLATFORM_SECRET_KEY:-}"
          # Optional integrations: omitted entirely when unset, so they stay inert.
          inject SENTRY_DSN "${SENTRY_DSN:-}"
          inject GOOGLE_CLIENT_ID "${GOOGLE_CLIENT_ID:-}"
          inject GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET:-}"

          # Future exact OCI secrets override the aggregate environment only
          # when configured. Unset exact secrets preserve any existing values.
          inject_if_present() {
            key="$1"; value="$2"
            if [ -n "$value" ]; then inject "$key" "$value"; fi
          }
          inject_if_present FUMA_OCI_EMAIL_REGION "${FUMA_OCI_EMAIL_REGION:-}"
          inject_if_present FUMA_OCI_EMAIL_TENANCY_ID "${FUMA_OCI_EMAIL_TENANCY_ID:-}"
          inject_if_present FUMA_OCI_EMAIL_USER_ID "${FUMA_OCI_EMAIL_USER_ID:-}"
          inject_if_present FUMA_OCI_EMAIL_FINGERPRINT "${FUMA_OCI_EMAIL_FINGERPRINT:-}"
          inject_if_present FUMA_OCI_EMAIL_PRIVATE_KEY_PEM "${FUMA_OCI_EMAIL_PRIVATE_KEY_PEM:-}"
          inject_if_present FUMA_OCI_EMAIL_COMPARTMENT_ID "${FUMA_OCI_EMAIL_COMPARTMENT_ID:-}"
          inject_if_present FUMA_OCI_EMAIL_APPROVED_SENDER "${FUMA_OCI_EMAIL_APPROVED_SENDER:-}"
          inject_if_present FUMA_OCI_EVENT_VERIFICATION_SECRET "${FUMA_OCI_EVENT_VERIFICATION_SECRET:-}"

          # Validate every production class the runtime enforces, so a missing
          # provider credential is reported here instead of crash-looping a pod
          # whose logs the Job controller then garbage-collects.
          missing=""
          check_class() {
            label="$1"; shift
            for key in "$@"; do
              grep -q "^${key}=." k8s/_staged/fuma.env || missing="$missing\n  - ${label}: ${key}"
            done
          }
          check_class 'runtime role' FUMA_ROLE
          check_class 'PostgreSQL' DATABASE_URL POSTGRES_USER POSTGRES_PASSWORD
          check_class 'Redis' FUMA_REDIS_URL
          check_class 'MinIO' FUMA_MINIO_ENDPOINT FUMA_MINIO_ACCESS_KEY_ID FUMA_MINIO_SECRET_ACCESS_KEY FUMA_MINIO_BUCKET
          check_class 'Publication unsubscribe signing' FUMA_PUBLICATION_UNSUBSCRIBE_SIGNING_SECRET
          check_class 'Object access signing' FUMA_OBJECT_ACCESS_SIGNING_SECRET
          check_class 'AI BYOK metadata encryption' FUMA_AI_BYOK_METADATA_KEY
          check_class 'Expert inquiry encryption' FUMA_EXPERT_INQUIRY_KEY
          check_class 'Member authentication' FUMA_MEMBER_AUTH_SECRET
          check_class 'Paystack provider' FUMA_PAYSTACK_PROVIDER_URL
          check_class 'Paystack platform billing' FUMA_PAYSTACK_PLATFORM_PUBLIC_KEY FUMA_PAYSTACK_PLATFORM_SECRET_KEY
          check_class 'Fuma-owned Cloudflare' FUMA_CLOUDFLARE_ACCOUNT_ID FUMA_CLOUDFLARE_ZONE_ID FUMA_CLOUDFLARE_API_TOKEN
          check_class 'Kenya locale' FUMA_LOCALE FUMA_CURRENCY FUMA_TIME_ZONE
          check_class 'protected owner' FUMA_PROTECTED_OWNER_EMAIL
          check_class 'staff cookie policy' FUMA_COOKIE_SECURE FUMA_COOKIE_HTTP_ONLY FUMA_COOKIE_SAME_SITE
          if [ -n "$missing" ]; then
            echo "::error::FUMA_ENV_SECRET is missing required production configuration:"
            printf "$missing\n"
            echo "::error::Fuma validates these classes fail-closed at boot. Add them to FUMA_ENV_SECRET and re-run. See docs/deployment/fuma-studio.md."
            exit 1
          fi
          chmod 644 k8s/_staged/fuma.env
          echo "staged $(wc -l < k8s/_staged/fuma.env) environment lines; all production classes present"

      - name: Render Studio manifest
        env:
          FUMA_DEPLOYMENT_ROOT_DOMAIN: ${{ vars.FUMA_DEPLOYMENT_ROOT_DOMAIN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          sed \
            -e "s|__FUMA_ROOT_DOMAIN__|$FUMA_DEPLOYMENT_ROOT_DOMAIN|g" \
            -e "s|__FUMA_RUNTIME_IMAGE__|ghcr.io/${{ github.repository_owner }}/fuma-runtime:$IMAGE_TAG|g" \
            -e "s|__FUMA_SOURCE_SHA__|$GITHUB_SHA|g" \
            infra/fuma-phase-13-18/k3s/studio-production.template.yaml > k8s/_staged/studio.yaml
          grep -Fq "Host(\`app.$FUMA_DEPLOYMENT_ROOT_DOMAIN\`)" k8s/_staged/studio.yaml
          ! grep -q '__FUMA_' k8s/_staged/studio.yaml
          chmod 644 k8s/_staged/studio.yaml

      - name: Prepare directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/fuma/studio
            sudo chown -R ubuntu:ubuntu /opt/fuma

      - name: Copy manifest and environment to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "k8s/_staged/studio.yaml,k8s/_staged/fuma.env"
          target: /opt/fuma/studio/
          strip_components: 2

      - name: Apply, migrate and roll out
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_PULL_TOKEN,REPO_OWNER
          command_timeout: 25m
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            NS=fuma
            ENV_FILE=/opt/fuma/studio/fuma.env

            sudo kubectl create namespace $NS 2>/dev/null || true

            # Private image pull rights for this run.
            sudo kubectl create secret docker-registry ghcr-secret -n $NS \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_USERNAME" \
              --docker-password="$GHCR_PULL_TOKEN" \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            # All Studio configuration in one Secret, from the single env file.
            sudo kubectl create secret generic fuma-secrets -n $NS \
              --from-env-file="$ENV_FILE" \
              --dry-run=client -o yaml | sudo kubectl apply -f -
            echo "fuma-secrets synced from $(wc -l < "$ENV_FILE") lines"
            sudo rm -f "$ENV_FILE"

            # Jobs have immutable specs, so recreate them each deploy.
            sudo kubectl delete job fuma-migrate minio-init -n $NS --ignore-not-found

            sudo kubectl apply -f /opt/fuma/studio/studio.yaml

            sudo kubectl set image deployment/fuma-studio studio=ghcr.io/$REPO_OWNER/fuma-runtime:$IMAGE_TAG -n $NS
            sudo kubectl set image deployment/fuma-worker worker=ghcr.io/$REPO_OWNER/fuma-runtime:$IMAGE_TAG -n $NS
            sudo kubectl set image deployment/fuma-scheduler scheduler=ghcr.io/$REPO_OWNER/fuma-runtime:$IMAGE_TAG -n $NS

            echo "waiting for datastores"
            sudo kubectl rollout status statefulset/postgres -n $NS --timeout=6m
            sudo kubectl rollout status deployment/redis -n $NS --timeout=4m
            sudo kubectl rollout status deployment/minio -n $NS --timeout=4m

            # `POSTGRES_PASSWORD` is only honoured when the volume is first
            # initialised, so a rotated secret would otherwise leave the running
            # database holding the old password while every application
            # connection uses the new one. Realign the role through the pod's
            # local socket, where the bootstrap superuser is trusted, so no
            # prior password is needed. Setting the same password is a no-op.
            PG_POD="$(sudo kubectl -n $NS get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')"
            PG_USER="$(sudo kubectl -n $NS get secret fuma-secrets -o jsonpath='{.data.POSTGRES_USER}' | base64 -d)"
            PG_PASS="$(sudo kubectl -n $NS get secret fuma-secrets -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)"
            if [ -n "$PG_POD" ] && [ -n "$PG_USER" ] && [ -n "$PG_PASS" ]; then
              if sudo kubectl -n $NS exec "$PG_POD" -- psql -v ON_ERROR_STOP=1 -U "$PG_USER" -d postgres \
                -c "alter role \"$PG_USER\" with login password '$PG_PASS'" >/dev/null 2>&1; then
                echo "postgres role password aligned with fuma-secrets"
              else
                echo "::warning::could not realign the postgres password; if connections fail, the volume predates this secret"
              fi
            fi

            echo "starting migrations after PostgreSQL credential alignment"
            sudo kubectl patch job fuma-migrate -n $NS --type=merge -p '{"spec":{"suspend":false}}'
            migrated=0
            for attempt in $(seq 1 72); do
              succeeded="$(sudo kubectl -n $NS get job fuma-migrate -o jsonpath='{.status.succeeded}' 2>/dev/null || echo '')"
              terminal_failure="$(sudo kubectl -n $NS get job fuma-migrate -o jsonpath='{range .status.conditions[?(@.type=="Failed")]}{.status}{end}' 2>/dev/null || echo '')"
              if [ "${succeeded:-0}" -ge 1 ] 2>/dev/null; then migrated=1; break; fi
              if [ "$terminal_failure" = "True" ]; then break; fi
              sleep 10
            done
            if [ "$migrated" != "1" ]; then
              echo "════════ migration failed ════════"
              sudo kubectl -n $NS describe job/fuma-migrate 2>&1 | tail -30 || true
              sudo kubectl -n $NS logs job/fuma-migrate --tail=200 2>&1 || true
              sudo kubectl -n $NS logs -l job-name=fuma-migrate --tail=200 --all-containers=true 2>&1 || true
              exit 1
            fi
            echo "migrations complete"
            sudo kubectl -n $NS logs job/fuma-migrate --tail=40 2>&1 || true

            # Clear pods stuck in image-pull backoff so they retry with the refreshed secret.
            sudo kubectl -n $NS delete pod -l app=fuma-studio --field-selector=status.phase=Pending --ignore-not-found

            if ! sudo kubectl rollout status deployment/fuma-studio -n $NS --timeout=10m; then
              echo "════════ studio rollout failed ════════"
              sudo kubectl -n $NS get pods -o wide
              sudo kubectl -n $NS describe deployment/fuma-studio | tail -40
              sudo kubectl -n $NS get events --sort-by=.lastTimestamp | tail -30
              sudo kubectl -n $NS logs deployment/fuma-studio --tail=200 --all-containers=true || true
              sudo kubectl -n $NS logs deployment/fuma-studio --tail=100 --previous || true
              exit 1
            fi
            sudo kubectl rollout status deployment/fuma-worker -n $NS --timeout=6m || true
            sudo kubectl rollout status deployment/fuma-scheduler -n $NS --timeout=6m || true

            echo "════════════ final state ════════════"
            sudo kubectl -n $NS get pods,svc,ingressroute -o wide
            sudo kubectl -n $NS logs deployment/fuma-studio --tail=60 --all-containers=true || true

            # In-cluster health is the authoritative check that Studio booted.
            # Public HTTPS additionally depends on DNS and TLS issuance.
            echo "════════════ in-cluster health ════════════"
            sudo kubectl -n $NS run studio-health-$RANDOM --rm -i --restart=Never \
              --image=curlimages/curl:latest --command -- \
              curl -sS -o /dev/null -w 'in-cluster /health -> %{http_code}\n' \
              --max-time 15 http://fuma-studio.fuma.svc.cluster.local/health

      - name: Public HTTPS smoke test
        env:
          FUMA_DEPLOYMENT_ROOT_DOMAIN: ${{ vars.FUMA_DEPLOYMENT_ROOT_DOMAIN }}
        run: |
          set -euo pipefail
          # DNS must exist before TLS can be issued. Report that precisely
          # rather than spending five minutes timing out on every host.
          missing=""
          for host in app auth admin; do
            fqdn="$host.$FUMA_DEPLOYMENT_ROOT_DOMAIN"
            if ! getent hosts "$fqdn" >/dev/null 2>&1; then missing="$missing $fqdn"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Studio is deployed but these hosts have no DNS record:$missing"
            echo "::error::Point them at the server (or the Cloudflare proxy) so Traefik can obtain certificates."
            exit 1
          fi

          for host in app auth admin; do
            url="https://$host.$FUMA_DEPLOYMENT_ROOT_DOMAIN/health"
            code=000
            for attempt in $(seq 1 30); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)"
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "$url -> $code"
            [ "$code" = "200" ]
          done
          # The apex must still belong to the public Web, not Studio.
          apex="$(curl -sS --max-time 20 "https://$FUMA_DEPLOYMENT_ROOT_DOMAIN/" || true)"
          printf '%s' "$apex" | grep -Fq 'Build, manage and publish in one place.'
