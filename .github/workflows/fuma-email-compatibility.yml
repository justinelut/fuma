name: Fuma email compatibility

on:
  pull_request:
    paths:
      - "apps/studio/server/fuma/email/**"
      - "apps/studio/src/core/fuma/email/**"
      - "apps/studio/src/__tests__/fuma/emailDocumentRenderer.test.ts"
      - "apps/studio/src/__tests__/architecture/fuma-email-boundaries.test.ts"
      - "apps/studio/scripts/fuma-email-compatibility-*.ts"
      - "apps/studio/package.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/fuma-email-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "apps/studio/server/fuma/email/**"
      - "apps/studio/src/core/fuma/email/**"
      - "apps/studio/src/__tests__/fuma/emailDocumentRenderer.test.ts"
      - "apps/studio/src/__tests__/architecture/fuma-email-boundaries.test.ts"
      - "apps/studio/scripts/fuma-email-compatibility-*.ts"
      - "apps/studio/package.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/fuma-email-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuma-email-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.12.0
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.14
      - name: Exact-lock render, preview, build, security, and native receipt gate
        env:
          FUMA_EMAIL_EXPECT_PLATFORM: linux
          FUMA_EMAIL_EXPECT_ARCH: arm64
          FUMA_EMAIL_RECEIPT_PATH: ${{ runner.temp }}/fuma-email-compatibility-linux-arm64.json
        run: bun run apps/studio/scripts/fuma-email-compatibility-target.ts
      - name: Upload architecture-bound native receipt
        uses: actions/upload-artifact@v4.6.2
        with:
          name: fuma-email-compatibility-linux-arm64
          path: ${{ runner.temp }}/fuma-email-compatibility-linux-arm64.json
          if-no-files-found: error
          retention-days: 14
