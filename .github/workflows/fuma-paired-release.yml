name: Fuma native ARM64 paired release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact protected-branch source SHA to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fuma-paired-release-${{ inputs.release_ref }}
  cancel-in-progress: false

env:
  REQUIRED_RUNNER_ARCH: ARM64
  REQUIRED_PLATFORM: linux/arm64
  FUMA_DEPLOYMENT_ROOT_DOMAIN: ${{ vars.FUMA_DEPLOYMENT_ROOT_DOMAIN }}

jobs:
  preflight:
    if: github.ref_protected == true && inputs.release_ref == github.sha
    runs-on: ubuntu-24.04-arm
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      lock_hash: ${{ steps.identity.outputs.lock_hash }}
      migration_high_water: ${{ steps.identity.outputs.migration_high_water }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref }}
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.14
      - name: Verify native ARM64 runner and exact repository identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = "$REQUIRED_RUNNER_ARCH"
          test "$(uname -m)" = aarch64
          printf '%s' "$FUMA_DEPLOYMENT_ROOT_DOMAIN" | grep -Eq '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$'
          test "$(git rev-parse HEAD)" = "${{ inputs.release_ref }}"
          printf '%s' '${{ inputs.release_ref }}' | grep -Eq '^[a-f0-9]{40}$'
          bun -e 'const p = await Bun.file("package.json").json(); if (p.packageManager !== "bun@1.3.14" || JSON.stringify(p.workspaces) !== JSON.stringify(["apps/*", "packages/*"])) throw new Error("root Bun/workspace contract mismatch")'
          test "$(find apps packages -path '*/node_modules' -prune -o -type f \( -name bun.lock -o -name bun.lockb -o -name package-lock.json -o -name pnpm-lock.yaml -o -name yarn.lock \) -print -quit)" = ""
          for base_image in '${{ vars.FUMA_BUN_IMAGE_DIGEST }}' '${{ vars.FUMA_NODE_IMAGE_DIGEST }}'; do
            printf '%s' "$base_image" | grep -Eq '^[^[:space:]@]+(:[^@[:space:]]+)?@sha256:[a-f0-9]{64}$' || { echo "Fuma base images must be immutable digest references" >&2; exit 1; }
            printf '%s' "$base_image" | grep -Eqv '@sha256:0{64}$' || { echo "Fuma base image digest cannot be a placeholder" >&2; exit 1; }
          done
          lock_hash=$(sha256sum bun.lock | cut -d' ' -f1)
          migration_high_water=$(bun --cwd=apps/studio -e "import { runnableHostedMigrations } from './server/fuma/db/migrations/index.ts'; const last=runnableHostedMigrations.at(-1); if(!last) throw new Error('no finalized migration'); console.log(last.id)")
          printf 'source_sha=%s\nlock_hash=%s\nmigration_high_water=%s\n' "${{ inputs.release_ref }}" "$lock_hash" "$migration_high_water" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun --cwd=packages/fuma-governance-launch run typecheck
      - run: bun --cwd=packages/fuma-governance-launch run test
      - run: bun --cwd=packages/fuma-governance-launch run release:demo
      - name: Validate smoke harness syntax
        run: bash -n infra/fuma-phase-13-18/docker/runtime-entrypoint.sh infra/fuma-phase-13-18/docker/runtime-smoke.sh infra/fuma-phase-13-18/docker/public-web-smoke.sh infra/fuma-phase-13-18/docker/site-runtime-smoke.sh

  architecture-gate:
    needs: preflight
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Refuse non-native execution
        run: test "$RUNNER_ARCH" = ARM64 && test "$(uname -m)" = aarch64
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Build exact runtime target natively
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: infra/fuma-phase-13-18/docker/runtime.Dockerfile
          target: runtime
          platforms: linux/arm64
          load: true
          tags: fuma-runtime-gate:arm64
          build-args: |
            BUN_IMAGE=${{ vars.FUMA_BUN_IMAGE_DIGEST }}
            SOURCE_SHA=${{ needs.preflight.outputs.source_sha }}
            LOCK_HASH_SHA256=${{ needs.preflight.outputs.lock_hash }}
            MIGRATION_HIGH_WATER_MARK=${{ needs.preflight.outputs.migration_high_water }}
      - name: Build exact email compatibility target natively
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: infra/fuma-phase-13-18/docker/runtime.Dockerfile
          target: compatibility
          platforms: linux/arm64
          load: true
          tags: fuma-runtime-compatibility:arm64
          build-args: |
            BUN_IMAGE=${{ vars.FUMA_BUN_IMAGE_DIGEST }}
            SOURCE_SHA=${{ needs.preflight.outputs.source_sha }}
            LOCK_HASH_SHA256=${{ needs.preflight.outputs.lock_hash }}
            MIGRATION_HIGH_WATER_MARK=${{ needs.preflight.outputs.migration_high_water }}
      - name: Build exact public-web target natively
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: infra/fuma-phase-13-18/docker/public-web.Dockerfile
          platforms: linux/arm64
          load: true
          tags: fuma-web-gate:arm64
          build-args: |
            BUN_IMAGE=${{ vars.FUMA_BUN_IMAGE_DIGEST }}
            NODE_IMAGE=${{ vars.FUMA_NODE_IMAGE_DIGEST }}
            FUMA_DEPLOYMENT_ROOT_DOMAIN=${{ vars.FUMA_DEPLOYMENT_ROOT_DOMAIN }}
            SOURCE_SHA=${{ needs.preflight.outputs.source_sha }}
            LOCK_HASH_SHA256=${{ needs.preflight.outputs.lock_hash }}
            MIGRATION_HIGH_WATER_MARK=${{ needs.preflight.outputs.migration_high_water }}
      - name: Build exact site-runtime target natively
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: infra/fuma-phase-13-18/docker/site-runtime.Dockerfile
          platforms: linux/arm64
          load: true
          tags: fuma-site-runtime-gate:arm64
          build-args: |
            BUN_IMAGE=${{ vars.FUMA_BUN_IMAGE_DIGEST }}
            NODE_IMAGE=${{ vars.FUMA_NODE_IMAGE_DIGEST }}
            SOURCE_SHA=${{ needs.preflight.outputs.source_sha }}
            LOCK_HASH_SHA256=${{ needs.preflight.outputs.lock_hash }}
            MIGRATION_HIGH_WATER_MARK=${{ needs.preflight.outputs.migration_high_water }}
      - name: Boot native runtime roles and migration command
        run: sh infra/fuma-phase-13-18/docker/runtime-smoke.sh fuma-runtime-gate:arm64 fuma-runtime-compatibility:arm64 linux/arm64 ${{ needs.preflight.outputs.source_sha }} ${{ needs.preflight.outputs.lock_hash }} ${{ needs.preflight.outputs.migration_high_water }} supply/prepublish/runtime-smoke/arm64.json
      - name: Boot native public-web standalone server
        run: sh infra/fuma-phase-13-18/docker/public-web-smoke.sh fuma-web-gate:arm64 linux/arm64 ${{ needs.preflight.outputs.source_sha }} ${{ needs.preflight.outputs.lock_hash }} ${{ needs.preflight.outputs.migration_high_water }} supply/prepublish/web-smoke/arm64.json
      - name: Boot native site-runtime standalone server
        run: sh infra/fuma-phase-13-18/docker/site-runtime-smoke.sh fuma-site-runtime-gate:arm64 linux/arm64 ${{ needs.preflight.outputs.source_sha }} ${{ needs.preflight.outputs.lock_hash }} ${{ needs.preflight.outputs.migration_high_water }} supply/prepublish/site-runtime-smoke/arm64.json
      - name: Scan native runtime gate image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: fuma-runtime-gate:arm64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan native public-web gate image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: fuma-web-gate:arm64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan native site-runtime gate image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: fuma-site-runtime-gate:arm64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Generate native runtime gate SBOM
        uses: anchore/sbom-action@v0.21.0
        with:
          image: fuma-runtime-gate:arm64
          format: spdx-json
          output-file: supply/runtime-arm64.spdx.json
      - name: Generate native public-web gate SBOM
        uses: anchore/sbom-action@v0.21.0
        with:
          image: fuma-web-gate:arm64
          format: spdx-json
          output-file: supply/web-arm64.spdx.json
      - name: Generate native site-runtime gate SBOM
        uses: anchore/sbom-action@v0.21.0
        with:
          image: fuma-site-runtime-gate:arm64
          format: spdx-json
          output-file: supply/site-runtime-arm64.spdx.json
      - name: Record architecture-gate outcome
        if: always()
        shell: bash
        run: |
          mkdir -p supply/prepublish
          jq -n --arg status "${{ job.status }}" --arg sourceSha "${{ needs.preflight.outputs.source_sha }}" \
            '{schemaVersion:2,status:$status,sourceSha:$sourceSha,platform:"linux/arm64",nativeRunner:true}' > supply/prepublish/gate-arm64.json
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: architecture-evidence-arm64
          path: supply
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: [preflight, architecture-gate]
    if: github.ref_protected == true && needs.preflight.outputs.source_sha == github.sha
    runs-on: ubuntu-24.04-arm
    environment: fuma-release-supply-chain
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.14
      - name: Refuse non-native execution
        run: test "$RUNNER_ARCH" = ARM64 && test "$(uname -m)" = aarch64
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite existing source-SHA image tags
        shell: bash
        run: |
          set -euo pipefail
          for repository in ghcr.io/corebunch/fuma-runtime ghcr.io/corebunch/fuma-web ghcr.io/corebunch/fuma-site-runtime; do
            if docker buildx imagetools inspect "$repository:${{ needs.preflight.outputs.source_sha }}" >/dev/null 2>&1; then
              echo "refusing to overwrite existing image tag: $repository:${{ needs.preflight.outputs.source_sha }}" >&2
              exit 73
            fi
          done
      - uses: actions/download-artifact@v4.1.8
        with:
          path: supply
          name: architecture-evidence-arm64
          merge-multiple: true
      - name: Publish runtime ARM64 image with SBOM and provenance
        id: runtime
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: infra/fuma-phase-13-18/docker/runtime.Dockerfile
          target: runtime
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/corebunch/fuma-runtime:${{ needs.preflight.outputs.source_sha }}
          build-args: |
            BUN_IMAGE=${{ vars.FUMA_BUN_IMAGE_DIGEST }}
            SOURCE_SHA=${{ needs.preflight.outputs.source_sha }}
            LOCK_HASH_SHA256=${{ needs.preflight.outputs.lock_hash }}
            MIGRATION_HIGH_WATER_MARK=${{ needs.preflight.outputs.migration_high_water }}
      - name: Publish public-web ARM64 image with SBOM and provenance
        id: web
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: infra/fuma-phase-13-18/docker/public-web.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/corebunch/fuma-web:${{ needs.preflight.outputs.source_sha }}
          build-args: |
            BUN_IMAGE=${{ vars.FUMA_BUN_IMAGE_DIGEST }}
            NODE_IMAGE=${{ vars.FUMA_NODE_IMAGE_DIGEST }}
            FUMA_DEPLOYMENT_ROOT_DOMAIN=${{ vars.FUMA_DEPLOYMENT_ROOT_DOMAIN }}
            SOURCE_SHA=${{ needs.preflight.outputs.source_sha }}
            LOCK_HASH_SHA256=${{ needs.preflight.outputs.lock_hash }}
            MIGRATION_HIGH_WATER_MARK=${{ needs.preflight.outputs.migration_high_water }}
      - name: Publish site-runtime ARM64 image with SBOM and provenance
        id: site_runtime
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: infra/fuma-phase-13-18/docker/site-runtime.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/corebunch/fuma-site-runtime:${{ needs.preflight.outputs.source_sha }}
          build-args: |
            BUN_IMAGE=${{ vars.FUMA_BUN_IMAGE_DIGEST }}
            NODE_IMAGE=${{ vars.FUMA_NODE_IMAGE_DIGEST }}
            SOURCE_SHA=${{ needs.preflight.outputs.source_sha }}
            LOCK_HASH_SHA256=${{ needs.preflight.outputs.lock_hash }}
            MIGRATION_HIGH_WATER_MARK=${{ needs.preflight.outputs.migration_high_water }}
      - name: Record immutable refs and exact ARM64 OCI indexes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'ghcr.io/corebunch/fuma-runtime@${{ steps.runtime.outputs.digest }}' > supply/runtime.digest
          printf '%s\n' 'ghcr.io/corebunch/fuma-web@${{ steps.web.outputs.digest }}' > supply/web.digest
          printf '%s\n' 'ghcr.io/corebunch/fuma-site-runtime@${{ steps.site_runtime.outputs.digest }}' > supply/site-runtime.digest
          for component in runtime web site-runtime; do
            printf '%s\n' '${{ needs.preflight.outputs.source_sha }}' > "supply/$component.source-sha"
            image=$(cat "supply/$component.digest")
            docker buildx imagetools inspect "$image" --raw > "supply/$component.index.json"
            jq -e '
              (.mediaType == "application/vnd.oci.image.index.v1+json" or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json")
              and ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length == 1)
              and ([.manifests[] | select((.platform.os == "linux" and .platform.architecture == "arm64") | not)]
                | all(.platform.os == "unknown" and .platform.architecture == "unknown" and .annotations["vnd.docker.reference.type"] == "attestation-manifest"))
            ' "supply/$component.index.json" >/dev/null
          done
      - name: Build native email compatibility probe
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: infra/fuma-phase-13-18/docker/runtime.Dockerfile
          target: compatibility
          platforms: linux/arm64
          load: true
          tags: fuma-runtime-compatibility:arm64
          build-args: |
            BUN_IMAGE=${{ vars.FUMA_BUN_IMAGE_DIGEST }}
            SOURCE_SHA=${{ needs.preflight.outputs.source_sha }}
            LOCK_HASH_SHA256=${{ needs.preflight.outputs.lock_hash }}
            MIGRATION_HIGH_WATER_MARK=${{ needs.preflight.outputs.migration_high_water }}
      - name: Boot all published ARM64 images by immutable digest
        shell: bash
        run: |
          set -euo pipefail
          runtime_image=$(cat supply/runtime.digest)
          web_image=$(cat supply/web.digest)
          site_runtime_image=$(cat supply/site-runtime.digest)
          docker pull --platform linux/arm64 "$runtime_image"
          docker pull --platform linux/arm64 "$web_image"
          docker pull --platform linux/arm64 "$site_runtime_image"
          sh infra/fuma-phase-13-18/docker/runtime-smoke.sh "$runtime_image" fuma-runtime-compatibility:arm64 linux/arm64 "${{ needs.preflight.outputs.source_sha }}" "${{ needs.preflight.outputs.lock_hash }}" "${{ needs.preflight.outputs.migration_high_water }}" supply/runtime-smoke/arm64.json
          sh infra/fuma-phase-13-18/docker/public-web-smoke.sh "$web_image" linux/arm64 "${{ needs.preflight.outputs.source_sha }}" "${{ needs.preflight.outputs.lock_hash }}" "${{ needs.preflight.outputs.migration_high_water }}" supply/web-smoke/arm64.json
          sh infra/fuma-phase-13-18/docker/site-runtime-smoke.sh "$site_runtime_image" linux/arm64 "${{ needs.preflight.outputs.source_sha }}" "${{ needs.preflight.outputs.lock_hash }}" "${{ needs.preflight.outputs.migration_high_water }}" supply/site-runtime-smoke/arm64.json
      - name: Scan published immutable ARM64 runtime digest
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/corebunch/fuma-runtime@${{ steps.runtime.outputs.digest }}
          format: sarif
          output: supply/runtime.trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan published immutable ARM64 public-web digest
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/corebunch/fuma-web@${{ steps.web.outputs.digest }}
          format: sarif
          output: supply/web.trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan published immutable ARM64 site-runtime digest
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/corebunch/fuma-site-runtime@${{ steps.site_runtime.outputs.digest }}
          format: sarif
          output: supply/site-runtime.trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Bind published scan receipts to exact source and ARM64 platform
        shell: bash
        run: |
          set -euo pipefail
          for component in runtime web site-runtime; do
            image=$(cat "supply/$component.digest")
            jq --arg image "$image" --arg sourceSha '${{ needs.preflight.outputs.source_sha }}' \
              '.properties.fuma = {schemaVersion:1,image:$image,sourceSha:$sourceSha,platform:"linux/arm64",scanner:"trivy",severity:["HIGH","CRITICAL"],ignoreUnfixed:false,passed:true}' \
              "supply/$component.trivy.sarif" > "supply/$component.trivy.receipted.sarif"
            mv "supply/$component.trivy.receipted.sarif" "supply/$component.trivy.sarif"
          done
      - name: Generate runtime SPDX from published immutable ARM64 digest
        uses: anchore/sbom-action@v0.21.0
        with:
          image: ghcr.io/corebunch/fuma-runtime@${{ steps.runtime.outputs.digest }}
          format: spdx-json
          output-file: supply/runtime.spdx.json
      - name: Generate public-web SPDX from published immutable ARM64 digest
        uses: anchore/sbom-action@v0.21.0
        with:
          image: ghcr.io/corebunch/fuma-web@${{ steps.web.outputs.digest }}
          format: spdx-json
          output-file: supply/web.spdx.json
      - name: Generate site-runtime SPDX from published immutable ARM64 digest
        uses: anchore/sbom-action@v0.21.0
        with:
          image: ghcr.io/corebunch/fuma-site-runtime@${{ steps.site_runtime.outputs.digest }}
          format: spdx-json
          output-file: supply/site-runtime.spdx.json
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Extract BuildKit SLSA provenance
        shell: bash
        run: |
          set -euo pipefail
          for component in runtime web site-runtime; do
            image=$(cat "supply/$component.digest")
            docker buildx imagetools inspect "$image" --format '{{json .Provenance}}' > "supply/$component.provenance.json"
            jq -e '.. | objects | select(.predicateType? == "https://slsa.dev/provenance/v1")' "supply/$component.provenance.json" >/dev/null
          done
      - name: Sign only scanned immutable image digests
        shell: bash
        run: |
          set -euo pipefail
          for component in runtime web site-runtime; do cosign sign --yes "$(cat "supply/$component.digest")"; done
      - name: Verify immutable image signatures
        shell: bash
        run: |
          set -euo pipefail
          identity='^https://github\.com/corebunch/instatic/\.github/workflows/fuma-paired-release\.yml@refs/(heads|tags)/.+'
          for component in runtime web site-runtime; do
            cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$(cat "supply/$component.digest")" --output json > "supply/$component.signature-verification.json"
          done
      - name: Record rollback-safe non-promoting publication plan
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg sourceSha '${{ needs.preflight.outputs.source_sha }}' \
            --arg runtimeImage "$(cat supply/runtime.digest)" --arg webImage "$(cat supply/web.digest)" \
            --arg siteRuntimeImage "$(cat supply/site-runtime.digest)" \
            '{schemaVersion:2,sourceSha:$sourceSha,runtimeImage:$runtimeImage,webImage:$webImage,siteRuntimeImage:$siteRuntimeImage,architectures:["linux/arm64"],state:"registry-published-unpromoted",promotionAuthority:"external-fuma-079-or-later",partialPublicationPolicy:"orphan-non-promotable",rollbackPolicy:"retain-last-known-good-digests",previousPairedReleaseManifestHashSha256:null,registryDeletionPlanned:false,deploymentMutationPerformed:false}' \
            > supply/publication-plan.json
      - name: Assemble immutable paired manifest
        shell: bash
        run: |
          set -euo pipefail
          bun packages/fuma-governance-launch/tooling/pairedRelease.ts \
            --source-sha=${{ needs.preflight.outputs.source_sha }} --lock-file=bun.lock \
            --migration-high-water=${{ needs.preflight.outputs.migration_high_water }} \
            --runtime-digest-file=supply/runtime.digest --runtime-source-sha-file=supply/runtime.source-sha \
            --web-digest-file=supply/web.digest --web-source-sha-file=supply/web.source-sha \
            --site-runtime-digest-file=supply/site-runtime.digest --site-runtime-source-sha-file=supply/site-runtime.source-sha \
            --runtime-index=supply/runtime.index.json --web-index=supply/web.index.json --site-runtime-index=supply/site-runtime.index.json \
            --runtime-scan=supply/runtime.trivy.sarif --web-scan=supply/web.trivy.sarif --site-runtime-scan=supply/site-runtime.trivy.sarif \
            --runtime-sbom=supply/runtime.spdx.json --web-sbom=supply/web.spdx.json --site-runtime-sbom=supply/site-runtime.spdx.json \
            --runtime-provenance=supply/runtime.provenance.json --web-provenance=supply/web.provenance.json --site-runtime-provenance=supply/site-runtime.provenance.json \
            --runtime-signature-verification=supply/runtime.signature-verification.json \
            --web-signature-verification=supply/web.signature-verification.json \
            --site-runtime-signature-verification=supply/site-runtime.signature-verification.json \
            --runtime-smoke-dir=supply/runtime-smoke --web-smoke-dir=supply/web-smoke --site-runtime-smoke-dir=supply/site-runtime-smoke \
            --publication-plan=supply/publication-plan.json --output=supply/paired-release.json
          bun packages/fuma-governance-launch/tooling/pairedRelease.ts \
            --verify=supply/paired-release.json --evidence=full \
            --runtime-index=supply/runtime.index.json --web-index=supply/web.index.json --site-runtime-index=supply/site-runtime.index.json \
            --runtime-scan=supply/runtime.trivy.sarif --web-scan=supply/web.trivy.sarif --site-runtime-scan=supply/site-runtime.trivy.sarif \
            --runtime-sbom=supply/runtime.spdx.json --web-sbom=supply/web.spdx.json --site-runtime-sbom=supply/site-runtime.spdx.json \
            --runtime-provenance=supply/runtime.provenance.json --web-provenance=supply/web.provenance.json --site-runtime-provenance=supply/site-runtime.provenance.json \
            --runtime-signature-verification=supply/runtime.signature-verification.json \
            --web-signature-verification=supply/web.signature-verification.json \
            --site-runtime-signature-verification=supply/site-runtime.signature-verification.json \
            --runtime-smoke-dir=supply/runtime-smoke --web-smoke-dir=supply/web-smoke --site-runtime-smoke-dir=supply/site-runtime-smoke \
            --publication-plan=supply/publication-plan.json
      - name: Prove manifest tamper and mixed-SHA rejection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/tampered
          cp supply/paired-release.json supply/paired-release.json.sha256 .tmp/tampered/
          jq '.migrationHighWaterMark = "000000_tampered"' .tmp/tampered/paired-release.json > .tmp/tampered/value
          mv .tmp/tampered/value .tmp/tampered/paired-release.json
          if bun packages/fuma-governance-launch/tooling/pairedRelease.ts --verify=.tmp/tampered/paired-release.json; then exit 1; fi
          printf '%040d\n' 1 > supply/site-runtime.mixed-source-sha
          if bun packages/fuma-governance-launch/tooling/pairedRelease.ts \
            --source-sha=${{ needs.preflight.outputs.source_sha }} --lock-file=bun.lock \
            --migration-high-water=${{ needs.preflight.outputs.migration_high_water }} \
            --runtime-digest-file=supply/runtime.digest --runtime-source-sha-file=supply/runtime.source-sha \
            --web-digest-file=supply/web.digest --web-source-sha-file=supply/web.source-sha \
            --site-runtime-digest-file=supply/site-runtime.digest --site-runtime-source-sha-file=supply/site-runtime.mixed-source-sha \
            --runtime-index=supply/runtime.index.json --web-index=supply/web.index.json --site-runtime-index=supply/site-runtime.index.json \
            --runtime-scan=supply/runtime.trivy.sarif --web-scan=supply/web.trivy.sarif --site-runtime-scan=supply/site-runtime.trivy.sarif \
            --runtime-sbom=supply/runtime.spdx.json --web-sbom=supply/web.spdx.json --site-runtime-sbom=supply/site-runtime.spdx.json \
            --runtime-provenance=supply/runtime.provenance.json --web-provenance=supply/web.provenance.json --site-runtime-provenance=supply/site-runtime.provenance.json \
            --runtime-signature-verification=supply/runtime.signature-verification.json \
            --web-signature-verification=supply/web.signature-verification.json \
            --site-runtime-signature-verification=supply/site-runtime.signature-verification.json \
            --runtime-smoke-dir=supply/runtime-smoke --web-smoke-dir=supply/web-smoke --site-runtime-smoke-dir=supply/site-runtime-smoke \
            --publication-plan=supply/publication-plan.json --output=.tmp/mixed-release.json; then
            echo 'mixed source SHA was accepted' >&2
            exit 1
          fi
      - name: Sign immutable paired release bytes
        shell: bash
        run: |
          set -euo pipefail
          identity='^https://github\.com/corebunch/instatic/\.github/workflows/fuma-paired-release\.yml@refs/(heads|tags)/.+'
          cosign sign-blob --yes --bundle supply/paired-release.sigstore.json supply/paired-release.json
          cosign verify-blob --bundle supply/paired-release.sigstore.json --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com supply/paired-release.json
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: paired-release-${{ needs.preflight.outputs.source_sha }}
          path: supply
          retention-days: 90
          if-no-files-found: error

