name: Fuma server deployment preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuma-server-preflight
  cancel-in-progress: false

env:
  FUMA_DEPLOYMENT_ROOT_DOMAIN: ${{ vars.FUMA_DEPLOYMENT_ROOT_DOMAIN }}
  SSH_USER: ${{ vars.SSH_USER }}
  SSH_PORT: ${{ vars.SSH_PORT }}

jobs:
  inventory:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Validate deployment and SSH configuration
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          printf '%s' "$FUMA_DEPLOYMENT_ROOT_DOMAIN" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
          test -n "$SERVER_IP"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_USER"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$'
          printf '%s' "$SSH_HOST_FINGERPRINT" | grep -Eq '^SHA256:[A-Za-z0-9+/]{43}$'
          bash -n tooling/deployment/k3s-host-collision-preflight.sh

      - name: Pin server key and inventory all k3s host claims
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          key_file="$RUNNER_TEMP/fuma-deploy-key"
          known_hosts="$RUNNER_TEMP/fuma-known-hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 0600 "$key_file"

          ssh-keyscan -T 10 -p "$SSH_PORT" -t ed25519 "$SERVER_IP" > "$known_hosts" 2>/dev/null
          test -s "$known_hosts"
          actual_fingerprint="$(ssh-keygen -E sha256 -lf "$known_hosts" | awk 'NR == 1 { print $2 }')"
          if [[ "$actual_fingerprint" != "$SSH_HOST_FINGERPRINT" ]]; then
            echo "server SSH host fingerprint mismatch" >&2
            exit 74
          fi

          ssh \
            -i "$key_file" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SERVER_IP" \
            "bash -s -- '$FUMA_DEPLOYMENT_ROOT_DOMAIN'" \
            < tooling/deployment/k3s-host-collision-preflight.sh \
            | tee "$RUNNER_TEMP/fuma-server-inventory.log"

      - name: Record fail-closed result
        if: always()
        shell: bash
        run: |
          {
            echo '### Fuma server preflight'
            echo
            echo '- Root: `${{ vars.FUMA_DEPLOYMENT_ROOT_DOMAIN }}`'
            echo '- Architecture required: `linux/arm64`'
            echo '- Existing Trimly namespace, path, route, or certificate claims block deployment.'
            echo '- This workflow performs no apply, deletion, rollout, DNS, TLS, database, or registry mutation.'
          } >> "$GITHUB_STEP_SUMMARY"
