name: Fuma public Web deploy

on:
  workflow_call:
    inputs:
      image_tag:
        description: Published fuma-web tag to deploy (7-character commit SHA)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published fuma-web tag to deploy (7-character commit SHA)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: fuma-public-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy public Web to K3s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Render production manifest
        env:
          FUMA_DEPLOYMENT_ROOT_DOMAIN: ${{ vars.FUMA_DEPLOYMENT_ROOT_DOMAIN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_TAG" | grep -Eq '^[a-f0-9]{7}$'
          bun tooling/deployment/render-public-web-production.ts \
            k8s-public-web.yaml \
            "ghcr.io/${{ github.repository_owner }}/fuma-web:$IMAGE_TAG" \
            "$GITHUB_SHA"
          grep -Fq "Host(\`$FUMA_DEPLOYMENT_ROOT_DOMAIN\`)" k8s-public-web.yaml
          ! grep -q '__FUMA_' k8s-public-web.yaml
          chmod 0644 k8s-public-web.yaml

      - name: Prepare manifest directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/fuma
            sudo chown -R ubuntu:ubuntu /opt/fuma

      - name: Copy manifest to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: k8s-public-web.yaml
          target: /opt/fuma/

      - name: Apply manifest and roll out
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          FUMA_PUBLIC_PROJECTION_SERVICE_TOKEN: ${{ secrets.FUMA_PUBLIC_PROJECTION_SERVICE_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_PULL_TOKEN,REPO_OWNER,FUMA_PUBLIC_PROJECTION_SERVICE_TOKEN
          command_timeout: 15m
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            NS=fuma

            sudo kubectl create namespace $NS 2>/dev/null || true

            sudo kubectl create secret docker-registry ghcr-secret -n $NS \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_USERNAME" \
              --docker-password="$GHCR_PULL_TOKEN" \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            test -n "$FUMA_PUBLIC_PROJECTION_SERVICE_TOKEN"
            sudo kubectl create secret generic public-web-secrets -n $NS \
              --from-literal=FUMA_PUBLIC_PROJECTION_SERVICE_TOKEN="$FUMA_PUBLIC_PROJECTION_SERVICE_TOKEN" \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            sudo kubectl apply -f /opt/fuma/k8s-public-web.yaml

            sudo kubectl set image deployment/public-web \
              web=ghcr.io/$REPO_OWNER/fuma-web:$IMAGE_TAG -n $NS

            # Clear pods stuck in image-pull backoff so they retry with the refreshed secret.
            sudo kubectl -n $NS delete pod -l app=public-web \
              --field-selector=status.phase=Pending --ignore-not-found

            if ! sudo kubectl rollout status deployment/public-web -n $NS --timeout=8m; then
              echo "════════════ rollout failed ════════════"
              sudo kubectl -n $NS get pods -o wide
              sudo kubectl -n $NS describe deployment/public-web | tail -40
              sudo kubectl -n $NS describe pods -l app=public-web | tail -80
              sudo kubectl -n $NS get events --sort-by=.lastTimestamp | tail -30
              sudo kubectl -n $NS logs deployment/public-web --all-containers=true --tail=100 || true
              sudo kubectl -n $NS logs deployment/public-web --all-containers=true --previous --tail=100 || true
              exit 1
            fi

            echo "════════════ final state ════════════"
            sudo kubectl -n $NS get pods,svc,ingressroute -o wide
            sudo kubectl -n $NS logs deployment/public-web --tail=50 --all-containers=true || true

      - name: Public HTTPS smoke test
        env:
          FUMA_DEPLOYMENT_ROOT_DOMAIN: ${{ vars.FUMA_DEPLOYMENT_ROOT_DOMAIN }}
        run: |
          set -euo pipefail
          base="https://$FUMA_DEPLOYMENT_ROOT_DOMAIN"

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$base/api/health" -o health.json; then break; fi
            sleep 10
          done
          cat health.json
          jq -e '.status == "ok"' health.json

          curl -fsS --max-time 20 "$base/" -o apex.html
          grep -Fq 'Build, manage and publish in one place.' apex.html

          # Login and sign-up must actually render, not 404 on an invalid handoff source.
          for target in 'kind=sign_in&source=direct' 'kind=sign_up&source=direct' 'kind=sign_up&source=home'; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base/start?$target")"
            echo "start?$target -> $code"
            [ "$code" = "200" ]
          done

          # Every /start link the homepage renders must resolve.
          grep -oE 'href="/start\?[^"]+"' apex.html | sed 's/href="//;s/"$//;s/&amp;/\&/g' | sort -u > start-links.txt
          while read -r link; do
            [ -n "$link" ] || continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base$link")"
            echo "homepage link $link -> $code"
            [ "$code" = "200" ]
          done < start-links.txt

          # Every image the homepage requests must be served, not 404.
          grep -oE 'src="/[^"]+\.(webp|png|jpg|jpeg|svg|avif)"' apex.html | sed 's/src="//;s/"$//' | sort -u > images.txt
          while read -r img; do
            [ -n "$img" ] || continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base$img")"
            echo "image $img -> $code"
            [ "$code" = "200" ]
          done < images.txt
