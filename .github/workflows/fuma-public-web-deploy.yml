name: Fuma public Web production deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact protected default-branch source SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: fuma-public-web-production
  cancel-in-progress: false

env:
  FUMA_DEPLOYMENT_ROOT_DOMAIN: ${{ vars.FUMA_DEPLOYMENT_ROOT_DOMAIN }}
  SSH_USER: ${{ vars.SSH_USER }}
  SSH_PORT: ${{ vars.SSH_PORT }}

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch && inputs.release_ref == github.sha
    runs-on: ubuntu-24.04-arm
    environment: fuma-production
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref }}

      - name: Validate exact release and deployment configuration
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = '${{ inputs.release_ref }}'
          printf '%s' '${{ inputs.release_ref }}' | grep -Eq '^[a-f0-9]{40}$'
          printf '%s' "$FUMA_DEPLOYMENT_ROOT_DOMAIN" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
          test -n "$SERVER_IP"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_USER"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$'
          printf '%s' "$SSH_HOST_FINGERPRINT" | grep -Eq '^SHA256:[A-Za-z0-9+/]{43}$'
          bash -n tooling/deployment/k3s-host-collision-preflight.sh
          bash -n tooling/deployment/deploy-public-web.sh

      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable published Web image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tagged="ghcr.io/${{ github.repository_owner }}/fuma-web:${{ inputs.release_ref }}"
          docker buildx imagetools inspect "$tagged" --raw > "$RUNNER_TEMP/web-index.json"
          digest="$(docker buildx imagetools inspect "$tagged" --format '{{json .Manifest}}' | jq -r '.digest')"
          printf '%s' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          jq -e '([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length == 1)' "$RUNNER_TEMP/web-index.json" >/dev/null
          image="ghcr.io/${{ github.repository_owner }}/fuma-web@${digest}"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3.10.0
      - name: Verify keyless image signature
        shell: bash
        run: |
          identity='^https://github\.com/${{ github.repository }}/\.github/workflows/fuma-paired-release\.yml@refs/(heads|tags)/.+'
          cosign verify \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            '${{ steps.image.outputs.image }}' > "$RUNNER_TEMP/web-signature-verification.json"

      - name: Render exact production manifest
        shell: bash
        run: |
          set -euo pipefail
          FUMA_DEPLOYMENT_ROOT_DOMAIN="$FUMA_DEPLOYMENT_ROOT_DOMAIN" bun tooling/deployment/render-public-web-production.ts \
            "$RUNNER_TEMP/public-web-production.yaml" \
            '${{ steps.image.outputs.image }}' \
            '${{ inputs.release_ref }}'
          grep -Fq 'Host(`trimly.co.ke`)' "$RUNNER_TEMP/public-web-production.yaml"
          grep -Fq 'Host(`www.trimly.co.ke`)' "$RUNNER_TEMP/public-web-production.yaml"
          ! grep -Eq 'REQUIRED_|__FUMA_|fuma\.co\.ke' "$RUNNER_TEMP/public-web-production.yaml"

      - name: Strict SSH preflight, monitored apply, and rollback capture
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/fuma-deploy-key"
          known_hosts="$RUNNER_TEMP/fuma-known-hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 0600 "$key_file"
          ssh-keyscan -T 10 -p "$SSH_PORT" -t ed25519 "$SERVER_IP" > "$known_hosts" 2>/dev/null
          test -s "$known_hosts"
          actual_fingerprint="$(ssh-keygen -E sha256 -lf "$known_hosts" | awk 'NR == 1 { print $2 }')"
          [[ "$actual_fingerprint" == "$SSH_HOST_FINGERPRINT" ]]
          ssh_options=(
            -i "$key_file" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15
          )
          scp_options=(
            -i "$key_file" -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15
          )
          ssh "${ssh_options[@]}" "$SSH_USER@$SERVER_IP" \
            "bash -s -- '$FUMA_DEPLOYMENT_ROOT_DOMAIN'" \
            < tooling/deployment/k3s-host-collision-preflight.sh
          remote_manifest="/tmp/fuma-public-web-${{ inputs.release_ref }}.yaml"
          scp "${scp_options[@]}" "$RUNNER_TEMP/public-web-production.yaml" "$SSH_USER@$SERVER_IP:$remote_manifest"
          ssh "${ssh_options[@]}" "$SSH_USER@$SERVER_IP" \
            "bash -s -- '$remote_manifest' '${{ steps.image.outputs.image }}' '${{ inputs.release_ref }}'" \
            < tooling/deployment/deploy-public-web.sh \
            | tee "$RUNNER_TEMP/public-web-rollout.log"

      - name: Verify public TLS, health, canonical redirect, cookies, and metadata
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://$FUMA_DEPLOYMENT_ROOT_DOMAIN/api/health" > "$RUNNER_TEMP/health.json" \
              && jq -e '.status == "ok" and .service == "public-web"' "$RUNNER_TEMP/health.json" >/dev/null; then break; fi
            sleep 10
          done
          jq -e '.status == "ok" and .service == "public-web"' "$RUNNER_TEMP/health.json" >/dev/null
          curl -fsS --max-time 20 "https://$FUMA_DEPLOYMENT_ROOT_DOMAIN/" -D "$RUNNER_TEMP/apex.headers" -o "$RUNNER_TEMP/apex.html"
          curl -fsS --max-time 20 -o /dev/null -D "$RUNNER_TEMP/www.headers" "https://www.$FUMA_DEPLOYMENT_ROOT_DOMAIN/"
          grep -Eiq '^location: https://trimly\.co\.ke/' "$RUNNER_TEMP/www.headers"
          grep -Fq '<link rel="canonical" href="https://trimly.co.ke"' "$RUNNER_TEMP/apex.html"
          grep -Fq 'Build, manage and publish in one place.' "$RUNNER_TEMP/apex.html"
          ! grep -Eiq '^set-cookie:.*domain=' "$RUNNER_TEMP/apex.headers"
          ! grep -Eiq 'fuma\.co\.ke|Nairobi|Kenya' "$RUNNER_TEMP/apex.html"

      - name: Upload rollout evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: public-web-production-${{ inputs.release_ref }}
          path: |
            ${{ runner.temp }}/web-index.json
            ${{ runner.temp }}/web-signature-verification.json
            ${{ runner.temp }}/public-web-production.yaml
            ${{ runner.temp }}/public-web-rollout.log
            ${{ runner.temp }}/health.json
            ${{ runner.temp }}/apex.headers
            ${{ runner.temp }}/www.headers
          retention-days: 30
          if-no-files-found: warn
