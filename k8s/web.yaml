apiVersion: apps/v1
kind: Deployment
metadata:
  name: instatic-web
  namespace: instatic
  labels:
    app.kubernetes.io/name: instatic
    app.kubernetes.io/component: web
    app.kubernetes.io/version: "__SOURCE_SHA__"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: instatic
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: instatic
        app.kubernetes.io/component: web
        app.kubernetes.io/version: "__SOURCE_SHA__"
    spec:
      serviceAccountName: instatic-runtime
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: __INSTATIC_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: instatic-secrets
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: instatic-web
  namespace: instatic
  labels:
    app.kubernetes.io/name: instatic
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: instatic
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: instatic-security-headers
  namespace: instatic
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      Server: ""
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: instatic-web
  namespace: instatic
  labels:
    app.kubernetes.io/name: instatic
    app.kubernetes.io/component: ingress
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`app.__DEPLOYMENT_ROOT_DOMAIN__`)
      kind: Rule
      priority: 200
      middlewares:
        - name: instatic-security-headers
      services:
        - name: instatic-web
          port: 80
    - match: Host(`auth.__DEPLOYMENT_ROOT_DOMAIN__`)
      kind: Rule
      priority: 200
      middlewares:
        - name: instatic-security-headers
      services:
        - name: instatic-web
          port: 80
    - match: Host(`admin.__DEPLOYMENT_ROOT_DOMAIN__`)
      kind: Rule
      priority: 200
      middlewares:
        - name: instatic-security-headers
      services:
        - name: instatic-web
          port: 80
  tls:
    certResolver: le
