apiVersion: batch/v1
kind: Job
metadata:
  name: instatic-migrate
  namespace: instatic
  labels:
    app.kubernetes.io/name: instatic
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: "__SOURCE_SHA__"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: instatic
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: instatic-runtime
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: __INSTATIC_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["bun", "db:migrate"]
          envFrom:
            - secretRef:
                name: instatic-secrets
          env:
            - name: BUN_INSTALL_CACHE_DIR
              value: /tmp/bun-cache
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
